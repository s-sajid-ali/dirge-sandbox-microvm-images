name: Publish python-dev microVM image

# Builds images/python-dev-arm64/Containerfile as a linux/arm64 OCI image
# and pushes it to GHCR, so it can be pulled directly with `dirge
# --microvm-image ghcr.io/<owner>/<repo>/python-dev-arm64:<tag>` on Apple
# Silicon without needing buildah installed locally.

on:
  push:
    branches: [main]
    paths:
      - "images/python-dev-arm64/**"
      - ".github/workflows/publish-python-dev.yml"
  pull_request:
    branches: [main]
    paths:
      - "images/python-dev-arm64/**"
      - ".github/workflows/publish-python-dev.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/python-dev-arm64

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr

      # Single-platform (linux/arm64) build produces a plain OCI image
      # manifest rather than a multi-arch index. dirge's manifest-fetch (as
      # of dirge-agent 0.21.11) sends an Accept header that omits the OCI
      # index / Docker manifest-list media types, so it can't resolve a
      # multi-arch index — see https://github.com/dirge-code/dirge.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/python-dev-arm64
          file: images/python-dev-arm64/Containerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,oci-mediatypes=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
